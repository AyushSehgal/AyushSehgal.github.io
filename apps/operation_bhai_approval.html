  var attempts = 0;

  async function sha256(msg) {
    var data = new TextEncoder().encode(msg);
    var buf = await crypto.subtle.digest("SHA-256", data);
    var arr = Array.from(new Uint8Array(buf));
    return arr.map(function(b) { return b.toString(16).padStart(2, "0"); }).join("");
  }

  async function tryAuth() {
    var input = document.getElementById("pw-input");
    var pw = input.value;
    if (!pw) return;

    var hash = await sha256(SALT + pw);
    attempts++;

    if (hash === EXPECTED) {
      // Decode and inject the game
      var decoded = atob(PAYLOAD);
      document.body.style.display = "";
      document.body.style.alignItems = "";
      document.body.style.justifyContent = "";
      document.body.innerHTML = "";

      // Parse out style and body content
      var temp = document.createElement("div");
      temp.innerHTML = decoded;

      // Extract and apply styles
      var styles = temp.querySelectorAll("style");
      for (var i = 0; i < styles.length; i++) {
        document.head.appendChild(styles[i].cloneNode(true));
      }

      // Extract scripts before adding to DOM
      var scripts = temp.querySelectorAll("script");
      var scriptTexts = [];
      for (var j = 0; j < scripts.length; j++) {
        scriptTexts.push(scripts[j].textContent);
        scripts[j].parentNode.removeChild(scripts[j]);
      }

      // Remove style tags from temp (already moved to head)
      var tempStyles = temp.querySelectorAll("style");
      for (var k = 0; k < tempStyles.length; k++) {
        tempStyles[k].parentNode.removeChild(tempStyles[k]);
      }

      // Add remaining HTML to body
      document.body.innerHTML = temp.innerHTML;

      // Execute scripts
      for (var s = 0; s < scriptTexts.length; s++) {
        var scr = document.createElement("script");
        scr.textContent = scriptTexts[s];
        document.body.appendChild(scr);
      }
    } else {
      input.style.borderColor = "#ff4444";
      input.style.animation = "shake 0.3s";
      var err = document.getElementById("lock-error");
      var msgs = [
        "ACCESS DENIED. Nice try.",
        "Wrong code. The system is watching.",
        "Nope. Are you even authorized for this?",
        "Still wrong. Maybe ask the person who sent you this.",
        "The system is losing patience."
      ];
      err.textContent = attempts <= 5 ? msgs[attempts - 1] : "Attempt " + attempts + ". You\'re persistent, we\'ll give you that.";
      document.getElementById("lock-attempts").textContent = "Failed attempts: " + attempts;
      setTimeout(function() {
        input.style.borderColor = "#333";
        input.style.animation = "none";
      }, 600);
      input.value = "";
      input.focus();
    }
  }

  document.getElementById("pw-btn").onclick = tryAuth;
  document.getElementById("pw-input").onkeydown = function(e) {
    if (e.key === "Enter") tryAuth();
  };
  document.getElementById("pw-input").focus();
